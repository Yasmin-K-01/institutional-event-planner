# ==========================================
# Database Configuration (Neon PostgreSQL)
# ==========================================
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://ep-dark-darkness-ayv166ro-pooler.c-5.us-east-2.aws.neon.tech/neondb?sslmode=require}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:neondb_owner}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:YOUR_DATABASE_PASSWORD_HERE}}

# Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ==========================================
# Server Configuration
# ==========================================
server.port=${PORT:8081}
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000

# ==========================================
# Feature Toggles & Security
# ==========================================
app.ai.enabled=false
app.email.enabled=true
app.security.remember-me-key=${REMEMBER_ME_KEY:change-this-in-production}

# ==========================================
# SMTP / JavaMailSender
# ==========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:your-email@example.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration