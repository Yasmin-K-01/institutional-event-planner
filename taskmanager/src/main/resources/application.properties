spring.datasource.url=jdbc:postgresql://ep-xxxxxx.us-east-2.aws.neon.tech:5432/neondb?sslmode=require
spring.datasource.username=your_real_username
spring.datasource.password=your_real_password
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Tomcat Server Thread Pool settings for 150+ users
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20


# HikariCP Database Connection Pool for PostgreSQL
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
