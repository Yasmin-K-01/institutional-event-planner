# ==========================================
# Database Configuration (PostgreSQL / Neon DB)
# ==========================================
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/taskmanager}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ==========================================
# Server Configuration (Render & Local support)
# ==========================================
server.port=${PORT:8081}
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000

# ==========================================
# Feature Toggles & Security
# ==========================================
app.ai.enabled=false
app.email.enabled=true
app.security.remember-me-key=${REMEMBER_ME_KEY:change-this-in-production}

# ==========================================
# SMTP / JavaMailSender (Gmail OTP Settings)
# ==========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=yasmink.ug.25.cs@francisxavier.ac.in
spring.mail.password=iefw qyrz wvuu xbeu
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Security Auto-Configuration Exclusion
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration