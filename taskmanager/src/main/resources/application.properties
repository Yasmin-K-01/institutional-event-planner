# Neon Database Connection (Pooler for better connection handling)
# NOTE: Set these via environment variables in production (Render dashboard)
# DATABASE_URL, DB_USERNAME, DB_PASSWORD
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/taskmanager?sslmode=disable}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Tomcat Server Configuration
server.port=8081
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20


# HikariCP Database Connection Pool for PostgreSQL
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000

# External Service Feature Toggles
# Set to false to disable external API calls (offline mode for development/testing)
app.ai.enabled=false
app.email.enabled=false

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration